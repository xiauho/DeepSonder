name: Validate schema-v2 AI with DSH

on:
  workflow_dispatch:
    inputs:
      target_chars:
        description: "Synthetic writing target (300-2000 characters)"
        required: true
        default: "600"
        type: string

permissions:
  contents: read

jobs:
  synthetic-live-ai:
    runs-on: [self-hosted, windows, x64, novalist-dsh]
    environment: electron-prerelease
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run reviewed-only schema-v2 AI workflows on synthetic prose
        shell: pwsh
        env:
          TARGET_CHARS: ${{ inputs.target_chars }}
        run: |
          python ./scripts/verify_v2_ai_workflows.py `
            --acknowledge-synthetic-remote `
            --target-chars $env:TARGET_CHARS `
            --source-commit "${{ github.sha }}" `
            --report ./v2-ai-dsh-validation.json
      - name: Upload redacted live-DSH report
        uses: actions/upload-artifact@v4
        with:
          name: novalist-v2-ai-dsh-validation
          path: v2-ai-dsh-validation.json
          if-no-files-found: error
