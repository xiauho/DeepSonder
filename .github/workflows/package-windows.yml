name: Package DeepSonder-PySide6 Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "pyside6-v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Verify series tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("pyside6-v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match PySide6 VERSION $version"
          }
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Build standalone PySide6 package
        shell: pwsh
        run: .\scripts\build_windows.ps1 -PythonExecutable python
      - name: Upload PySide6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepsonder-pyside6-windows-x64
          path: dist/release-pyside6/*
          if-no-files-found: error
