name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q main.py sidecar_main.py application core sidecar ui
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Enforce reconstruction quality baseline
        run: python scripts/evaluate_reconstruction.py --fail-on-regression

  electron-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install Electron desktop dependencies
        working-directory: electron
        run: npm ci
      - name: Build and test Electron desktop bridge
        working-directory: electron
        run: npm test
