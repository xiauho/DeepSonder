name: Validate Electron Candidate

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: "Run ID of the signed Package Electron Windows workflow"
        required: true
        type: string
      ai_run_id:
        description: "Run ID of the live schema-v2 DSH validation workflow"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  clean-machine:
    name: Clean ${{ matrix.client }}
    environment: electron-prerelease
    strategy:
      fail-fast: false
      matrix:
        client: [windows-10, windows-11]
    runs-on: [self-hosted, windows, x64, novalist-clean, "${{ matrix.client }}"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Download signed candidate from packaging run
        uses: actions/download-artifact@v4
        with:
          name: novalist-electron-windows-x64
          path: candidate
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}
      - name: Validate install, trust pin, backup, and recovery
        shell: pwsh
        env:
          RELEASE_PUBLIC_KEY_B64: ${{ secrets.NOVALIST_RELEASE_PUBLIC_KEY_B64 }}
        run: |
          if (-not $env:RELEASE_PUBLIC_KEY_B64) {
            throw "The protected environment must provide the trusted release public key."
          }
          $publicKey = Join-Path $env:RUNNER_TEMP "novalist-release-public.pem"
          [IO.File]::WriteAllBytes($publicKey, [Convert]::FromBase64String($env:RELEASE_PUBLIC_KEY_B64))
          ./scripts/validate_electron_candidate.ps1 `
            -ReleaseDirectory ./candidate `
            -PublicKeyPath $publicKey `
            -ReportPath ./candidate-validation-report.json
      - name: Upload clean-machine report
        uses: actions/upload-artifact@v4
        with:
          name: novalist-${{ matrix.client }}-candidate-report
          path: candidate-validation-report.json
          if-no-files-found: error

  release-gate:
    name: Bind clean-client reports
    needs: clean-machine
    runs-on: windows-latest
    environment: electron-prerelease
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Download both clean-client reports
        uses: actions/download-artifact@v4
        with:
          pattern: novalist-*-candidate-report
          path: reports
      - name: Verify both reports belong to the exact signed candidate
        shell: pwsh
        run: |
          node ./electron/scripts/candidate-report-gate.mjs `
            ./reports/novalist-windows-10-candidate-report/candidate-validation-report.json `
            ./reports/novalist-windows-11-candidate-report/candidate-validation-report.json `
            ./candidate-release-gate.json
      - name: Download live schema-v2 DSH report
        uses: actions/download-artifact@v4
        with:
          name: novalist-v2-ai-dsh-validation
          path: ai-report
          run-id: ${{ inputs.ai_run_id }}
          github-token: ${{ github.token }}
      - name: Bind signed candidate and live AI evidence to one source
        shell: pwsh
        run: |
          node ./electron/scripts/release-readiness-gate.mjs `
            ./candidate-release-gate.json `
            ./ai-report/v2-ai-dsh-validation.json `
            ./release-readiness-report.json
      - name: Upload bound release-gate report
        uses: actions/upload-artifact@v4
        with:
          name: novalist-candidate-release-gate
          path: candidate-release-gate.json
          if-no-files-found: error
      - name: Upload manual release-review evidence
        uses: actions/upload-artifact@v4
        with:
          name: novalist-release-readiness-review
          path: release-readiness-report.json
          if-no-files-found: error
